worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $request_time s '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'req_id="$upstream_http_x_request_id"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Hide Nginx version
    server_tokens off;

    # Request size limit (ticket descriptions + attachments)
    client_max_body_size 5M;

    upstream api_gateway {
        server api-gateway:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Timeouts
        proxy_connect_timeout   10s;
        proxy_send_timeout      120s;
        proxy_read_timeout      120s;

        # Proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # API routes → api-gateway
        location / {
            proxy_pass http://api_gateway;
        }

        # Health check shortcut (no auth required)
        location /health {
            proxy_pass http://api_gateway/health;
            access_log off;
        }

        # Block access to internal endpoints from outside
        location /internal/ {
            return 403;
        }
    }
}
