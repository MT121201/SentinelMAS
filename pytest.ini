[pytest]
asyncio_mode = auto

testpaths =
    services
    tests/integration

# Smoke tests require a running stack — excluded by default
# Run with: pytest tests/smoke/ -v
addopts = --ignore=tests/smoke --ignore=tests/load -q

markers =
    smoke: requires docker compose stack running
    load: locust load tests (run separately)
    integration: cross-service integration tests with mocked dependencies
