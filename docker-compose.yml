version: "3.9"

x-common-env: &common-env
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  POSTGRES_DSN: postgresql+asyncpg://mas:${POSTGRES_PASSWORD}@pgbouncer:5432/masdb
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  QDRANT_URL: http://qdrant:6333
  VAULT_URL: http://ssh-vault:8100
  LANGFUSE_HOST: http://llmops:3000
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
  LOG_LEVEL: INFO
  ANTHROPIC_RPM_LIMIT: ${ANTHROPIC_RPM_LIMIT:-60}
  ANTHROPIC_TPM_LIMIT: ${ANTHROPIC_TPM_LIMIT:-100000}
  DAILY_COST_LIMIT_USD: ${DAILY_COST_LIMIT_USD:-50}

services:
  # ─── Public edge ──────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - public
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── API Gateway ──────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      <<: *common-env
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks:
      - public
      - internal
    depends_on:
      - redis
      - pgbouncer
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Orchestrator ─────────────────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: services/agent-orchestrator/Dockerfile
    environment:
      <<: *common-env
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ORCHESTRATOR_URL: http://orchestrator:8001
      MAX_CONCURRENT_AGENTS: ${MAX_CONCURRENT_AGENTS:-10}
    networks:
      - internal
    depends_on:
      - redis
      - pgbouncer
      - ssh-vault
      - rag-service
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "1G"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── InServer Agent ───────────────────────────────────────
  inserver-agent:
    build:
      context: .
      dockerfile: services/inserver-agent/Dockerfile
    environment:
      <<: *common-env
      AGENT_TYPE: inserver
      WORKER_CONCURRENCY: ${INSERVER_WORKERS:-3}
      ORCHESTRATOR_URL: http://orchestrator:8001
    networks:
      - internal
    depends_on:
      - orchestrator
    deploy:
      replicas: 1   # scale: docker compose up --scale inserver-agent=3
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Client Agent ─────────────────────────────────────────
  client-agent:
    build:
      context: .
      dockerfile: services/client-agent/Dockerfile
    environment:
      <<: *common-env
      AGENT_TYPE: client
      WORKER_CONCURRENCY: ${CLIENT_WORKERS:-5}
      ORCHESTRATOR_URL: http://orchestrator:8001
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    networks:
      - internal
    depends_on:
      - orchestrator
      - rag-service
    deploy:
      replicas: 2   # scale first for high ticket volume
      resources:
        limits:
          cpus: "2.0"
          memory: "1G"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Report Agent ─────────────────────────────────────────
  report-agent:
    build: ./services/report-agent
    environment:
      <<: *common-env
      MANAGER_WEBHOOK_URL: ${MANAGER_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── RAG Service ──────────────────────────────────────────
  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    environment:
      <<: *common-env
      EMBEDDING_MODEL: text-embedding-3-small
      RERANK_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      CACHE_TTL_ACTIVE: 3600
      CACHE_TTL_STATIC: 86400
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    networks:
      - internal
    depends_on:
      - qdrant
      - redis
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # reranker model load takes time

  # ─── SSH Vault ────────────────────────────────────────────
  ssh-vault:
    build:
      context: .
      dockerfile: services/ssh-vault/Dockerfile
    environment:
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      POSTGRES_DSN: postgresql+asyncpg://mas:${POSTGRES_PASSWORD}@pgbouncer:5432/masdb
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks:
      - internal   # NO public port exposure
    depends_on:
      - pgbouncer
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Scheduler ────────────────────────────────────────────
  scheduler:
    build: ./services/scheduler
    environment:
      <<: *common-env
      ORCHESTRATOR_URL: http://orchestrator:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    networks:
      - internal
    depends_on:
      - orchestrator
      - pgbouncer

  # ─── LLMOps (Langfuse) ────────────────────────────────────
  llmops:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://mas:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://localhost:3000
      SALT: ${LANGFUSE_SALT}
    ports:
      - "3000:3000"   # internal access only in prod
    networks:
      - internal
    depends_on:
      - postgres

  # ─── Postgres ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: masdb,langfuse
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d masdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PgBouncer ────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    environment:
      DATABASE_URL: postgres://mas:${POSTGRES_PASSWORD}@postgres:5432/masdb
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "600M"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Qdrant ───────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Prometheus ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - internal
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  # ─── Grafana ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - internal
    depends_on:
      - prometheus
      - loki

  # ─── Loki ─────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    volumes:
      - loki_data:/loki
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - internal

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  prom_data:
  grafana_data:
  loki_data:

networks:
  public:
  internal:
    internal: true
